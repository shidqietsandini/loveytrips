<!DOCTYPE html>

<style>
:root{color-scheme:light;--ink:#24333a;--muted:#68767a;--accent:#a4513b;--paper:#fffaf4;--line:#ead9c8;--safe:env(safe-area-inset-bottom,0px)}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;color:var(--ink);font:15px/1.5 'Plus Jakarta Sans',sans-serif;background:linear-gradient(135deg,#f8e9da 0%,#e6f0e9 34%,#f3e7d7 68%,#dce9e8 100%);background-attachment:fixed}button{font:inherit;color:inherit;cursor:pointer}.hero{position:relative;overflow:hidden;padding:clamp(34px,8vw,82px) max(22px,calc((100vw - 1060px)/2));color:#fff;background:linear-gradient(115deg,rgba(10,48,57,.92),rgba(22,91,94,.72)),radial-gradient(ellipse at 82% 15%,#edbb8d,transparent 38%),linear-gradient(135deg,#143f4b,#b36a4a);min-height:300px}.hero:after{content:'✦';position:absolute;right:9%;top:-90px;font-size:300px;line-height:1;color:#fff;opacity:.08}.eyebrow{text-transform:uppercase;letter-spacing:.18em;font-size:11px;font-weight:800;color:#f4cba7}.hero h1{position:relative;z-index:1;margin:7px 0;font:700 clamp(46px,8vw,88px)/.95 'Cormorant Garamond',serif;letter-spacing:.02em}.hero p{margin:12px 0 0;color:#e5efeb}.trip-meta{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.pill{border:1px solid #ffffff50;background:#ffffff18;border-radius:99px;padding:7px 12px;font-size:12px;backdrop-filter:blur(8px)}main{max-width:1060px;margin:auto;padding:38px 22px calc(58px + var(--safe))}.section-title{text-align:center;margin:0 0 24px}.section-title small{color:var(--muted);text-transform:uppercase;letter-spacing:.18em;font-weight:700;font-size:11px}.section-title h2{margin:3px 0;font:700 clamp(32px,5vw,47px)/1.1 'Cormorant Garamond',serif}.cards{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:13px}.day-card{position:relative;height:184px;overflow:hidden;border:2px solid #fff9;border-radius:15px;padding:0;text-align:left;color:white;background:linear-gradient(145deg,#153f49,#b36a4a);box-shadow:0 12px 25px #344c4920;transition:.2s}.day-card:hover{transform:translateY(-4px);box-shadow:0 16px 30px #344c4930}.day-card.active{border-color:#a4513b;box-shadow:0 0 0 2px #fff,0 12px 25px #344c4930}.day-art{position:absolute;inset:0;width:100%;height:100%;opacity:.94}.day-card:after{content:'';position:absolute;inset:25% 0 0;background:linear-gradient(transparent,rgba(10,31,34,.88))}.day-no{position:absolute;z-index:1;right:8px;top:-11px;font:700 86px/1 'Cormorant Garamond',serif;color:#fff5}.day-copy{position:absolute;z-index:2;bottom:10px;left:10px;right:8px}.day-copy b{display:block;font:700 18px/1.05 'Cormorant Garamond',serif;text-transform:uppercase;letter-spacing:.07em}.day-copy small{display:block;font-size:10px;opacity:.88;margin-top:4px}.day-copy .status{font-size:9px;opacity:.72}.day-heading{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:42px 0 10px}.day-heading h3{margin:0;font:700 clamp(46px,8vw,70px)/.9 'Cormorant Garamond',serif;text-transform:uppercase}.date,.progress-label{color:var(--muted);font-size:13px}.progress{height:5px;border-radius:9px;background:#d8d6c9;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,#bd6845,#e4ae72,#4d8c7c);transition:width .25s}ul{list-style:none;padding:0;margin:20px 0 0}li{display:grid;grid-template-columns:112px 1fr;gap:14px;margin:0 0 12px;align-items:start}.time{padding-top:15px;text-align:right;color:var(--accent);font-weight:800;font-size:12px}.item{display:flex;gap:12px;align-items:flex-start;padding:15px 16px;border:1px solid #ead9c8;border-radius:14px;background:linear-gradient(115deg,#fffaf4ed,#fff4e8e8);box-shadow:0 8px 22px #594d3b0d}.item-body{flex:1;min-width:0}.item-name{font-weight:800}.note{white-space:pre-line;color:var(--muted);font-size:13px;margin-top:3px}.tick{flex:none;width:27px;height:27px;border:2px solid #b76447;border-radius:50%;background:transparent;color:transparent}.done .tick{background:#a4513b;color:white}.done .item{opacity:.55}.done .item-name{text-decoration:line-through}.remove{display:block;border:0;background:none;color:var(--muted);text-decoration:underline;padding:4px 0 0;font-size:11px}.add{width:100%;border:1.5px dashed #bb8065;border-radius:13px;padding:13px;background:#fff9;color:#904b37;font-weight:800}.add:hover{background:#fff}.form{display:grid;grid-template-columns:120px 1fr;gap:9px;margin-top:9px;padding:14px;border:1px solid var(--line);border-radius:14px;background:#fff9}.form input,.form textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px;background:#fffdf9;font:inherit}.wide,.actions{grid-column:1/-1}.actions{display:flex;justify-content:flex-end;gap:8px}.actions button{padding:9px 15px;border:0;border-radius:9px;font-weight:700}.save{background:#a4513b;color:#fff}.cancel{background:#eee5d9}.empty{padding:24px;text-align:center;border:1px dashed #cdb9a5;border-radius:14px;color:var(--muted);margin-top:15px}.foot{text-align:center;color:var(--muted);font-size:11px;padding:28px 12px}.map{display:inline-block;margin-top:7px;color:#28655e;font-size:12px;font-weight:700;text-decoration:none}.map:hover{text-decoration:underline}@media(max-width:850px){.cards{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:520px){.hero{min-height:260px}.cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.day-card{height:155px}.day-no{font-size:74px}.day-copy{left:8px;bottom:8px}.day-copy b{font-size:16px}.day-heading{margin-top:32px}li{grid-template-columns:1fr;gap:3px}.time{text-align:left;padding:0 4px}.item{padding:13px}.form{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="hero"><div class="eyebrow">A little getaway · 2026</div><h1>Escapade to<br>Singapore</h1><p>Six days of city lights, gardens and little discoveries.</p><div class="trip-meta"><span class="pill">🇸🇬 &nbsp;26 Nov – 1 Dec 2026</span><span class="pill">✈️ &nbsp;Surabaya ↔ Singapore</span><span class="pill">♡ &nbsp;A trip for two</span></div></header>
<main><div class="section-title"><small>Your itinerary</small><h2>Day by day in Singapore</h2></div><div class="cards" id="cards"></div><section id="details"></section></main><footer class="foot">Escapade · Singapore, November 2026 · Your changes are saved in this browser</footer>
<script>
const DAYS=[['Thu','26 Nov','Thursday, 26 November'],['Fri','27 Nov','Friday, 27 November'],['Sat','28 Nov','Saturday, 28 November'],['Sun','29 Nov','Sunday, 29 November'],['Mon','30 Nov','Monday, 30 November'],['Tue','1 Dec','Tuesday, 1 December']];
const KEY='sg-itinerary-v1';let data={},current=0,adding=false;
try{data=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){}
const seed={day0:[{time:'Before flight',name:'Download MyICA Mobile',note:'Download the app before you fly.',nomap:true},{time:'16:30',name:'Flight SQ-927 · Surabaya (SUB T2) → Singapore (SIN)',note:'Departs 16:30, lands 19:55 (Singapore time).',nomap:true},{time:'After landing',name:'Fill in SG Arrival Card (MyICA)',note:'Foreign Visitor → SG Arrival Card → Individual submission → scan passport.',nomap:true},{time:'After landing',name:'Jewel Changi',note:'From T2, find the Skytrain to T1 & T3 → Cafe O → turn right, go straight → Skytrain to Terminal 3.'},{time:'Night',name:'Changi Airport → V Hotel Lavender',note:'MRT to Tanah Merah, then change to the East-West line towards Tuas Link.'}],day5:[{time:'12:00+',name:'Solace Studios · free boarding-pass photobooth',note:'Jewel Changi Airport, Level 4, Unit #04-239.'},{time:'16:40',name:'Flight SQ-928 · Singapore (SIN T2) → Surabaya (SUB T2)',note:'Departs 16:40, lands 17:55 (Surabaya time).',nomap:true}]};
if(!data.__seeded){Object.keys(seed).forEach(k=>data[k]=[...(data[k]||[]),...seed[k]]);data.__seeded=3;store()}else if(data.__seeded<3){Object.keys(seed).forEach(k=>{data[k]=data[k]||[];if(k==='day5'&&!data[k].some(x=>(x.name||'').includes('Solace Studios')))data[k].unshift(seed[k][0]);if(k==='day0'&&!data[k].some(x=>(x.name||'').includes('Flight SQ-927')))data[k].splice(Math.min(1,data[k].length),0,seed[k][1]);});data.__seeded=3;store()}
function store(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
// Original vector illustrations, drawn directly in SVG so every day gets its own crisp image without external image dependencies.
function artwork(k){const skies=['#e6b781','#d78967','#eece9c','#92b69e','#d2a980','#87aeba'],deep=['#214b55','#274854','#8b5945','#305c53','#456a70','#254a59'];let scene='';if(k===0)scene='<path d="M0 114 Q85 20 180 112L180 180H0Z" fill="#d5a878"/><path d="M52 91l58-20 23 5-33 10 29 7-5 8-34-7-25 16-6-4 14-17-22 8z" fill="#fff7e8"/><circle cx="145" cy="37" r="18" fill="#ffe6aa"/>';if(k===1)scene='<path d="M0 155h180v25H0z" fill="#244d58"/><path d="M48 145V72l15-9 15 9v73m5 0V54l17-12 17 12v91m8 0V72l15-9 15 9v73" fill="#f0d7b1"/><path d="M36 72h112l-8-12H44z" fill="#c5835b"/><path d="M10 150q8-46 17 0m-9-23 9-11m30 35q8-46 17 0m-9-23 9-11m66 34q8-46 17 0m-9-23 9-11" fill="none" stroke="#d7b27f" stroke-width="5"/>';if(k===2)scene='<path d="M0 145h180v35H0z" fill="#7d4d3e"/><path d="M20 145V85h140v60M20 105h140M45 85V68h90v17" fill="none" stroke="#f2dfc0" stroke-width="8"/><path d="M74 145v-30a16 16 0 0132 0v30" fill="#d6a778"/><circle cx="90" cy="47" r="17" fill="#ffe4a8"/><path d="M0 150q25-24 50 0m80 0q25-24 50 0" fill="none" stroke="#60816a" stroke-width="9"/>';if(k===3)scene='<path d="M0 154h180v26H0z" fill="#315650"/><path d="M48 150l12-82 14 82m34 0 13-98 15 98" stroke="#664f3e" stroke-width="8"/><path d="M24 80q36-44 72 0-36 17-72 0m55-15q36-44 72 0-36 17-72 0m-7 54q44-43 88 0-44 19-88 0" fill="#77a47a"/><circle cx="151" cy="39" r="17" fill="#ffe1a0"/>';if(k===4)scene='<path d="M0 150q44-58 90 0 44-58 90 0v30H0z" fill="#597765"/><path d="M0 126Q45 57 90 126t90 0" fill="none" stroke="#f2d8ab" stroke-width="8"/><path d="M20 145V85h140v60M20 101h140" fill="none" stroke="#d3b387" stroke-width="5"/><circle cx="90" cy="45" r="17" fill="#fff0c1"/>';if(k===5)scene='<path d="M0 130q45-30 90 0t90 0v50H0z" fill="#24525d"/><path d="M30 127h120v28H30z" fill="#e3c89e"/><path d="M43 126l8-57h78l8 57" fill="#eedbb9"/><path d="M72 69l19-17 19 17" fill="#b97855"/><path d="M54 91h66M54 105h66" stroke="#a77b5d" stroke-width="4"/><path d="M22 44l55 19-28 4 25 14-5 7-31-16-18 9-4-5 12-14-14-11z" fill="#fff7e9"/>';return `<svg class="day-art" viewBox="0 0 180 180" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs><linearGradient id="sky${k}" x2="0" y2="1"><stop stop-color="${skies[k]}"/><stop offset="1" stop-color="${deep[k]}"/></linearGradient></defs><rect width="180" height="180" fill="url(#sky${k})"/>${scene}</svg>`}
function render(){const cards=document.getElementById('cards');cards.innerHTML='';DAYS.forEach((d,k)=>{const a=data['day'+k]||[],done=a.filter(x=>x.done).length,b=document.createElement('button');b.className='day-card'+(k===current?' active':'');b.innerHTML=artwork(k)+`<span class="day-no">${k+1}</span><span class="day-copy"><b>Day ${k+1}</b><small>${d[0]}, ${d[1]}</small><small class="status">${a.length?(done===a.length?'all done ✓':done+'/'+a.length+' done'):'no plans yet'}</small></span>`;b.onclick=()=>{current=k;adding=false;render();document.getElementById('detail').scrollIntoView({behavior:'smooth',block:'start'})};cards.appendChild(b)});const root=document.getElementById('details'),items=data['day'+current]||[],d=DAYS[current],done=items.filter(x=>x.done).length;root.innerHTML=`<div id="detail" class="day-heading"><div><h3>Day ${current+1}</h3><span class="date">${d[2]} 2026</span></div><div class="progress-label">${done} of ${items.length} done</div></div><div class="progress"><i style="width:${items.length?Math.round(done/items.length*100):0}%"></i></div>`;if(!items.length)root.insertAdjacentHTML('beforeend','<div class="empty">No places planned yet. Add your first stop below.</div>');else{const ul=document.createElement('ul');items.forEach((it,i)=>{const li=document.createElement('li');li.className=it.done?'done':'';li.innerHTML=`<div class="time">${esc(it.time)}</div><div class="item"><button class="tick" aria-label="Toggle complete">✓</button><div class="item-body"><div class="item-name">${esc(it.name)}</div>${it.note?`<div class="note">${esc(it.note)}</div>`:''}${!it.nomap?`<a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(it.name+' Singapore')}">📍 Open in Maps</a>`:''}${it.done?'<button class="remove">remove</button>':''}</div></div>`;li.querySelector('.tick').onclick=()=>{it.done=!it.done;store();render()};const rm=li.querySelector('.remove');if(rm)rm.onclick=()=>{items.splice(i,1);data['day'+current]=items;store();render()};ul.appendChild(li)});root.appendChild(ul)}if(!adding){const b=document.createElement('button');b.className='add';b.textContent='+ Add a place';b.onclick=()=>{adding=true;render()};root.appendChild(b)}else{const f=document.createElement('form');f.className='form';f.innerHTML='<input name="time" placeholder="Time"><input name="name" placeholder="Place name" required><textarea class="wide" name="note" rows="2" placeholder="Notes (optional)"></textarea><div class="actions"><button type="button" class="cancel">Cancel</button><button class="save">Add to itinerary</button></div>';f.querySelector('.cancel').onclick=()=>{adding=false;render()};f.onsubmit=e=>{e.preventDefault();const fd=new FormData(f);const list=data['day'+current]||[];list.push({time:fd.get('time'),name:fd.get('name').trim(),note:fd.get('note').trim()});data['day'+current]=list;store();adding=false;render()};root.appendChild(f)}}
render();
</script>
</body>
</html>
