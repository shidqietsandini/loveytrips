<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f8f5ff">
<title>Singapore Itinerary · 26 Nov – 1 Dec</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
:root{color-scheme:light;--ink:#2a2340;--mute:#7d7699;--line:#e6dcfa;--lil:#8b5cf6;--lil2:#6d28d9;--chip:#f3ecff;--paper:#fff;--safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{min-height:100%;scroll-padding-top:calc(16px + var(--safe-top))}
body{margin:0;min-height:100vh;font-family:"Plus Jakarta Sans",-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);line-height:1.5;background:radial-gradient(1000px 520px at 100% -10%,#eadcff 0,transparent 65%),linear-gradient(160deg,#fff 0%,#f8f5ff 54%,#eee6fc 100%) fixed}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #a78bfa;outline-offset:3px}
.app{display:flex;align-items:flex-start;min-height:100vh}
aside{position:sticky;top:var(--safe-top);height:calc(100dvh - var(--safe-top) - var(--safe-bottom));width:288px;flex:none;padding:20px 14px;display:flex;flex-direction:column;gap:14px;background:rgba(255,255,255,.82);backdrop-filter:blur(16px);border-right:1px solid var(--line);transition:width .25s ease;overflow:hidden;z-index:20}
aside.c{width:78px}
.brand{display:flex;align-items:center;gap:10px;padding:0 4px}
.logo{flex:none;width:44px;height:44px;border-radius:15px;background:linear-gradient(135deg,#c4b5fd,#8b5cf6);display:grid;place-items:center;font-size:22px;box-shadow:0 6px 16px #8b5cf633}
.bt{white-space:nowrap}.bt b{display:block;font-size:16px;letter-spacing:-.3px}.bt small{color:var(--mute);font-size:12px}
.tog{min-height:42px;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;border:1px solid var(--line);background:#fff;white-space:nowrap;color:var(--mute);font-size:13px}
.tog span:first-child{width:22px;text-align:center;font-size:18px;line-height:1;color:var(--lil2)}.tog:hover{background:var(--chip)}
nav{display:flex;flex-direction:column;gap:6px;overflow-y:auto;flex:1;scrollbar-width:thin}
.dn{display:flex;gap:12px;align-items:center;padding:8px;border-radius:14px;border:1px solid transparent;background:none;text-align:left;width:100%;transition:background .15s,border-color .15s}
.dn:hover{background:var(--chip)}.dn.on{background:linear-gradient(135deg,#efe7ff,#ddd0fd);border-color:var(--line)}
.num{flex:none;width:38px;height:38px;border-radius:12px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;font-weight:800;color:var(--lil2)}.dn.on .num{background:linear-gradient(135deg,#a78bfa,#7c3aed);color:#fff;border-color:transparent}
.dt{min-width:0;white-space:nowrap}.dt b{display:block;font-size:14px}.dt small{color:var(--mute);font-size:12px}
aside.c .bt,aside.c .lab,aside.c .dt,aside.c .tot{display:none}
.tot{font-size:12px;color:var(--mute);padding:4px}.bar{height:8px;border-radius:99px;background:#eadffc;overflow:hidden;margin:7px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,#c4b5fd,#7c3aed);border-radius:99px;transition:width .3s}
.bd{display:none;position:fixed;inset:0;background:rgba(42,35,64,.35);z-index:15}
main{flex:1;min-width:0;max-width:1000px;padding:36px clamp(20px,5vw,64px) 88px}
.welcome{position:relative;overflow:hidden;margin:0 0 30px;padding:clamp(22px,4vw,36px);border:1px solid #e8defa;border-radius:28px;background:linear-gradient(115deg,rgba(255,255,255,.96),rgba(247,241,255,.84));box-shadow:0 18px 48px -34px rgba(80,45,140,.45)}
.welcome:after{content:"✦";position:absolute;right:5%;top:-40px;color:#c4b5fd;font-size:150px;line-height:1;opacity:.34;pointer-events:none}
.kicker{display:flex;align-items:center;gap:8px;color:var(--lil2);font-weight:800;font-size:12px;letter-spacing:.11em;text-transform:uppercase}
.welcome h1{max-width:700px;margin:12px 0 10px;font-size:clamp(34px,6vw,58px);letter-spacing:-2px;line-height:1.04;background:linear-gradient(135deg,#5423b8,#a66ee8);-webkit-background-clip:text;background-clip:text;color:transparent}
.welcome p{max-width:600px;margin:0;color:var(--mute);font-size:15px}
.trip-facts{position:relative;z-index:1;display:flex;flex-wrap:wrap;gap:9px;margin-top:22px}.fact{display:inline-flex;align-items:center;gap:7px;padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.82);font-size:12px;font-weight:700;color:#5a4a7e}
.day-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.day-title{margin:0;font-size:clamp(28px,4vw,38px);letter-spacing:-1.3px;line-height:1.1;color:var(--ink)}
.date{color:var(--mute);margin-top:5px;font-size:14px}.nv{display:flex;gap:8px}.nv button{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:#fff;font-size:20px;color:var(--lil2);transition:background .15s,transform .15s}.nv button:hover:not(:disabled){background:var(--chip);transform:translateY(-1px)}.nv button:disabled{opacity:.35;cursor:default}
.pl{color:var(--mute);font-size:13px;margin-top:18px}ul{list-style:none;margin:17px 0 0;padding:0}
li{display:grid;grid-template-columns:92px 1fr;gap:14px;margin-bottom:13px;align-items:start}
.tm{padding-top:17px;text-align:right;font-size:12px;font-weight:800;color:var(--lil2);line-height:1.3}
.it{display:flex;gap:13px;align-items:flex-start;background:rgba(255,255,255,.91);border:1px solid var(--line);border-radius:19px;padding:16px;box-shadow:0 8px 24px -16px rgba(109,40,217,.5);transition:transform .18s,box-shadow .18s}
.it:hover{transform:translateY(-1px);box-shadow:0 12px 28px -16px rgba(109,40,217,.45)}.bodyc{flex:1;min-width:0}.nm{font-weight:800;line-height:1.35}.ntxt{white-space:pre-line;color:var(--mute);font-size:14px;margin-top:5px}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.chips a{min-height:34px;display:inline-flex;align-items:center;font-size:12px;font-weight:700;text-decoration:none;padding:5px 11px;border-radius:99px;background:var(--chip);color:var(--lil2);border:1px solid var(--line)}.chips a:hover{background:#e9dcff}
.tick{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--lil);background:transparent;color:transparent;font-size:15px;line-height:1;display:grid;place-items:center;padding:0;transition:all .15s}.tick:hover{background:var(--chip)}li.done .tick{background:linear-gradient(135deg,#c4b5fd,#7c3aed);border-color:transparent;color:#fff}li.done .it{opacity:.62;background:rgba(255,255,255,.65)}li.done .nm{text-decoration:line-through}
.rm{background:none;border:0;color:var(--mute);font-size:12px;padding:4px 0 0;margin-top:7px;text-decoration:underline}.rm:hover{color:var(--lil2)}
.empty{text-align:center;padding:38px 12px;color:var(--mute);border:1.5px dashed #d5c4f7;border-radius:18px;margin-top:18px;background:rgba(255,255,255,.42)}
.addbtn{width:100%;min-height:52px;margin-top:7px;padding:13px;border-radius:16px;border:1.5px dashed #c9b3f5;background:rgba(255,255,255,.58);color:var(--lil2);font-weight:800}.addbtn:hover{background:var(--chip)}
.form{display:grid;grid-template-columns:110px 1fr;gap:10px;margin-top:8px;background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:18px;padding:16px}.form input,.form textarea{width:100%;min-height:46px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:#fff;color:var(--ink);font:inherit;font-size:14px}.form input:focus,.form textarea:focus{outline:2px solid #c4b5fd;border-color:transparent}.form .w{grid-column:1/-1}.row{grid-column:1/-1;display:flex;gap:8px;justify-content:flex-end}.pri,.sec{min-height:44px;padding:10px 18px;border-radius:12px;font-weight:700}.pri{border:0;background:linear-gradient(135deg,#a78bfa,#7c3aed);color:#fff}.sec{border:1px solid var(--line);background:#fff;color:var(--mute)}
@media(max-width:720px){
 .app{display:block;min-height:100vh}
 aside,aside.c{position:sticky;left:auto;top:0;width:100%;height:auto;min-height:0;padding:calc(10px + var(--safe-top)) 14px 9px;display:flex;flex-direction:row;flex-wrap:wrap;gap:9px;background:rgba(255,255,255,.94);border-right:0;border-bottom:1px solid var(--line);overflow:visible;backdrop-filter:blur(18px)}
 .brand{width:100%;padding:0 2px}.logo{width:38px;height:38px;border-radius:13px;font-size:19px}.bt b{font-size:14px}.bt small{font-size:11px}
 .tog,.tot,.bd{display:none!important}
 nav{order:2;display:flex;flex-direction:row;gap:7px;width:100%;flex:none;overflow-x:auto;overflow-y:hidden;padding:0 1px 3px;scrollbar-width:none;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}nav::-webkit-scrollbar{display:none}
 .dn{flex:0 0 auto;width:auto;min-height:42px;gap:7px;padding:4px 9px;border-radius:13px;scroll-snap-align:start}.num{width:30px;height:30px;border-radius:10px;font-size:12px}.dt{display:block!important}.dt b{font-size:11px}.dt small{display:none}
 aside.c .bt,aside.c .dt{display:block}
 main{max-width:none;margin:0;padding:20px 16px calc(42px + var(--safe-bottom))}
 .welcome{margin-bottom:25px;padding:23px 20px;border-radius:22px}.welcome:after{right:-8px;top:-15px;font-size:105px}.welcome h1{font-size:clamp(34px,10vw,46px);letter-spacing:-1.5px}.welcome p{font-size:14px}.trip-facts{gap:7px;margin-top:17px}.fact{padding:7px 10px;font-size:11px}
 .day-title{font-size:29px}.date{font-size:13px}.nv button{width:42px;height:42px}
 .pl{margin-top:16px}li{grid-template-columns:1fr;gap:5px;margin-bottom:11px}.tm{text-align:left;padding:0 4px;font-size:11px}.it{gap:11px;padding:14px;border-radius:17px}.ntxt{font-size:13px}.tick{width:30px;height:30px}
 .form{grid-template-columns:1fr;padding:13px}.form input,.form textarea{font-size:16px}.form .w{grid-column:auto}.row{grid-column:auto}.pri,.sec{flex:1}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
<aside id="side">
  <div class="brand"><div class="logo">🦁</div><div class="bt"><b>Singapore</b><small>26 Nov – 1 Dec 2026</small></div></div>
  <button class="tog" id="tog" aria-label="Toggle sidebar"><span id="arr">‹</span><span class="lab">Collapse</span></button>
  <nav id="nav" aria-label="Choose an itinerary day"></nav>
  <div class="tot" id="tot"></div>
</aside>
<div class="bd" id="bd"></div>
<main id="main"></main>
</div>
<script>
var DAYS=[["Thu","Thursday","26 November","26 Nov"],["Fri","Friday","27 November","27 Nov"],["Sat","Saturday","28 November","28 Nov"],["Sun","Sunday","29 November","29 Nov"],["Mon","Monday","30 November","30 Nov"],["Tue","Tuesday","1 December","1 Dec"]];
var KEY="sg-itinerary-v1",data={},adding=false;
try{var s=localStorage.getItem(KEY);if(s)data=JSON.parse(s)||{};}catch(e){data={};}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data));}catch(e){}}
var SEED={day0:[
{time:"Before flight",name:"Download MyICA Mobile",note:"Download the app before you fly.",nomap:1},
{time:"16:30",name:"Flight SQ-927 · Surabaya (SUB T2) → Singapore (SIN)",note:"Departs 16:30, lands 19:55 (Singapore time).",nomap:1},
{time:"After landing",name:"Fill in SG Arrival Card (MyICA)",note:"Foreign Visitor → SG Arrival Card → Individual submission → scan passport.",nomap:1},
{time:"After landing",name:"Jewel Changi",note:"From T2, find the Skytrain to T1 & T3 → Cafe O → turn right, go straight → Skytrain to Terminal 3."},
{time:"Night",name:"Changi Airport → V Hotel Lavender",note:"MRT: Changi Airport (CG) → Tanah Merah (2 stops, ~7 min) → change to the EW line towards Tuas Link, Platform F (walk 1 min, wait up to 5 min) → Lavender (7 stops, ~17 min) → exit B → walk ~2 min.\nTip: you land at 19:55, so there’s plenty of time before the last trains (around 23:20).",nomap:1,links:[{label:"🗺️ Directions",url:"https://maps.app.goo.gl/o9Nou5XvzoERPcdx6"}]}
],day5:[
{time:"16:40",name:"Flight SQ-928 · Singapore (SIN T2) → Surabaya (SUB T2)",note:"Departs 16:40, lands 17:55 (Surabaya time).",nomap:1}
]};
if(!data.__seeded){["day0","day5"].forEach(function(k){data[k]=(data[k]||[]).concat(SEED[k]);});data.__seeded=2;save();}
else if(data.__seeded<2){
  var d0=(data.day0||[]).filter(function(x){return x.name.indexOf("Flight SQ-929")!==0;});
  d0.forEach(function(x){if(x.name.indexOf("V Hotel Lavender")>-1&&x.note)x.note=SEED.day0[4].note;});
  var at=0;d0.forEach(function(x,i){if(x.name.indexOf("Download MyICA")===0)at=i+1;});
  d0.splice(at,0,SEED.day0[1]);data.day0=d0;data.__seeded=2;save();
}
var SOLACE={time:"12:00+",name:"Solace Studios · free boarding-pass photobooth",note:"Jewel Changi Airport, Level 4, Unit #04-239 (near Lift Lobby C).\nStore open 10:00–22:00 daily; the free boarding-pass photobooth is available from 12:00 noon. Your flight departs at 16:40.",nomap:1,links:[{label:"📍 Map",url:"https://www.google.com/maps/search/?api=1&query="+encodeURIComponent("Solace Studios Jewel Changi Airport")}]};
if(data.__seeded<3){data.day5=data.day5||[];if(!data.day5.some(function(x){return x.name.indexOf("Solace Studios")===0;}))data.day5.unshift(SOLACE);data.__seeded=3;save();}
function $(i){return document.getElementById(i);}
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e;}
function link(href,text){var a=el("a","",text);a.href=href;a.target="_blank";a.rel="noopener noreferrer";return a;}
function fixUrl(u){u=(u||"").trim();if(!u)return"";if(!/^https?:\/\//i.test(u))u="https://"+u;try{var x=new URL(u);return(x.protocol==="http:"||x.protocol==="https:")?x.href:"";}catch(e){return"";}}
function mins(t){var m=/^(\d{1,2}):(\d{2})/.exec(t||"");return m?(+m[1])*60+(+m[2]):-1;}
function isMobile(){return window.innerWidth<=720;}
function cur(){var m=/^#day([1-6])$/.exec(location.hash);return m?(+m[1])-1:0;}
function counts(k){var a=data["day"+k]||[];return[a.filter(function(x){return x.done;}).length,a.length];}
var side=$("side"),bd=$("bd"),col;
try{var sc=localStorage.getItem("sg-col");col=sc===null?isMobile():sc==="1";}catch(e){col=isMobile();}
function setCol(v){col=v;side.classList.toggle("c",v);bd.classList.toggle("show",!v&&isMobile());$("arr").textContent=v?"›":"‹";try{localStorage.setItem("sg-col",v?"1":"0");}catch(e){}}
$("tog").onclick=function(){setCol(!col);};bd.onclick=function(){setCol(true);};
function render(){
  var i=cur(),nav=$("nav"),td=0,tt=0;nav.textContent="";
  DAYS.forEach(function(d,k){
    var c=counts(k);td+=c[0];tt+=c[1];var b=el("button","dn"+(k===i?" on":""));b.type="button";b.title="Day "+(k+1)+" · "+d[0]+", "+d[3];b.setAttribute("aria-current",k===i?"page":"false");
    b.appendChild(el("span","num",(c[1]&&c[0]===c[1])?"✓":String(k+1)));var t=el("span","dt");t.appendChild(el("b","",d[0]+", "+d[3]));t.appendChild(el("small","",c[1]?c[0]+"/"+c[1]+" done":"No plans yet"));b.appendChild(t);
    b.onclick=function(){if(k!==cur()){adding=false;location.hash="day"+(k+1);}};nav.appendChild(b);
  });
  var tot=$("tot");tot.textContent="";tot.appendChild(document.createTextNode("Trip progress · "+td+"/"+tt));var bar=el("div","bar"),fill=el("i");fill.style.width=(tt?Math.round(td/tt*100):0)+"%";bar.appendChild(fill);tot.appendChild(bar);tot.appendChild(document.createTextNode("Saved in this browser"));
  var m=$("main"),id="day"+i,items=data[id]||[],d=DAYS[i],c=counts(i);m.textContent="";
  if(i===0){var welcome=el("section","welcome");welcome.setAttribute("aria-label","Trip overview");welcome.appendChild(el("div","kicker","✦ Your Singapore getaway"));welcome.appendChild(el("h1","","A little city, a lot to love."));welcome.appendChild(el("p","","Six days of Singapore, with the key details and your plans all in one place. Pick a day, check things off as you go, and add your own stops anytime."));var facts=el("div","trip-facts");facts.appendChild(el("span","fact","📅 26 Nov – 1 Dec 2026"));facts.appendChild(el("span","fact","✈️ Surabaya ⇄ Singapore"));facts.appendChild(el("span","fact","💾 Saved on this device"));welcome.appendChild(facts);m.appendChild(welcome);}
  var hero=el("div","day-head"),hl=el("div");hl.appendChild(el("h2","day-title","Day "+(i+1)));hl.appendChild(el("div","date",d[1]+", "+d[2]+" 2026"));var nv=el("div","nv"),pv=el("button","","‹"),nx=el("button","","›");pv.type=nx.type="button";pv.setAttribute("aria-label","Previous day");nx.setAttribute("aria-label","Next day");pv.disabled=i===0;nx.disabled=i===5;pv.onclick=function(){adding=false;location.hash="day"+i;};nx.onclick=function(){adding=false;location.hash="day"+(i+2);};nv.appendChild(pv);nv.appendChild(nx);hero.appendChild(hl);hero.appendChild(nv);m.appendChild(hero);
  m.appendChild(el("div","pl",c[1]?c[0]+" of "+c[1]+" done":"Nothing planned yet"));var bar2=el("div","bar"),f2=el("i");f2.style.width=(c[1]?Math.round(c[0]/c[1]*100):0)+"%";bar2.appendChild(f2);m.appendChild(bar2);
  if(!items.length){m.appendChild(el("div","empty","✨ No places yet. Add your first stop below."));}
  else{var ul=el("ul");items.forEach(function(it,idx){var li=el("li",it.done?"done":"");li.appendChild(el("div","tm",it.time||""));var card=el("div","it"),tk=el("button","tick","✓");tk.type="button";tk.title=it.done?"Mark as not done":"Mark as done";tk.setAttribute("aria-label",tk.title);tk.onclick=function(){it.done=!it.done;data[id]=items;save();render();};var bc=el("div","bodyc");bc.appendChild(el("div","nm",it.name));if(it.note)bc.appendChild(el("div","ntxt",it.note));var ch=el("div","chips");if(it.photo)ch.appendChild(link(it.photo,"📷 Photo inspo"));(it.links||[]).forEach(function(l){ch.appendChild(link(l.url,l.label));});if(!it.nomap)ch.appendChild(link("https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(it.name+" Singapore"),"📍 Map"));if(ch.childNodes.length)bc.appendChild(ch);if(it.done){var rm=el("button","rm","remove");rm.type="button";rm.onclick=function(){items.splice(idx,1);data[id]=items;save();render();};bc.appendChild(rm);}card.appendChild(tk);card.appendChild(bc);li.appendChild(card);ul.appendChild(li);});m.appendChild(ul);}
  if(!adding){var ab=el("button","addbtn","+ Add a place");ab.type="button";ab.onclick=function(){adding=true;render();};m.appendChild(ab);}
  else{var f=el("div","form");var t=document.createElement("input");t.placeholder="Time";t.setAttribute("aria-label","Time");var nm=document.createElement("input");nm.placeholder="Place name";nm.setAttribute("aria-label","Place name");var ph=document.createElement("input");ph.placeholder="Photo inspo link (https://...)";ph.type="url";ph.className="w";ph.setAttribute("aria-label","Photo inspiration link");var nt=document.createElement("textarea");nt.placeholder="Notes (optional)";nt.rows=2;nt.className="w";nt.setAttribute("aria-label","Notes");var row=el("div","row"),cn=el("button","sec","Cancel"),sv=el("button","pri","Add to Day "+(i+1));cn.type=sv.type="button";cn.onclick=function(){adding=false;render();};sv.onclick=function(){var name=nm.value.trim();if(!name){nm.focus();return;}var it={name:name,time:t.value.trim(),photo:fixUrl(ph.value),note:nt.value.trim()};var list=data[id]||[],mt=mins(it.time),pos=list.length;if(mt>=0){for(var k=0;k<list.length;k++){if(mins(list[k].time)>mt){pos=k;break;}}}list.splice(pos,0,it);data[id]=list;save();adding=false;render();};row.appendChild(cn);row.appendChild(sv);f.appendChild(t);f.appendChild(nm);f.appendChild(ph);f.appendChild(nt);f.appendChild(row);m.appendChild(f);nm.focus();}
}
window.addEventListener("hashchange",function(){render();window.scrollTo(0,0);});
setCol(col);render();
</script>
</body>
</html>
